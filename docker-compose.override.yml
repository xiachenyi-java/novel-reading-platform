# ============================================================
# 生产环境覆盖配置（Nginx 前端托管 + 反向代理）
# 作者：夏辰义
# 日期：2026-10-22
# 说明：
#   本文件由 docker compose 自动叠加到 docker-compose.yml 之上。
#   原本只存在于服务器 /opt/book，2026-10-22 收进版本库，避免配置漂移。
# ============================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: demo2-nginx
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # 其余容器沿用主 compose 定义，这里只补重启策略
  app:
    restart: unless-stopped
  mysql:
    restart: unless-stopped
  redis:
    restart: unless-stopped
