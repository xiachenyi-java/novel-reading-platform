# ============================================================
# Nginx 站点配置（生产环境）
# 作者：夏辰义
# 日期：2026-10-22
# 说明：
#   1. 托管前端 dist（Vue createWebHistory 需要 try_files 兜底）
#   2. /api/ 反代到后端，proxy_pass 末尾的 "/" 用于去掉 /api 前缀
#      （前端 baseURL 是 /api，后端接口是 /novels，必须去掉）
#   3. /uploads/ 透传给后端静态资源映射
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------- 前端单页应用路由兜底 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        # 末尾的 "/" 不能省，否则 /api 前缀不会被去掉
        proxy_pass http://app:80/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # ---------- 上传文件（封面图等） ----------
    location /uploads/ {
        proxy_pass http://app:80/uploads/;
    }
}
